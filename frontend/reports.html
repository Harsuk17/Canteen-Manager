<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Report - Office Canteen</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .client-report-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .report-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
        }
        .report-grid > div {
            background: var(--bg-color);
            padding: 0.5rem;
            border-radius: var(--radius-sm);
        }
        .btn-pay {
            background: var(--success);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            width: 100%;
            margin-bottom: 0.5rem;
        }
        .btn-delay {
            background: var(--warning);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            flex: 1;
        }
        .btn-monthly {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="top-bar flex justify-between items-center">
            <h1>
                <svg fill="currentColor" viewBox="0 0 24 24" style="width:20px;height:20px;"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                Daily Report
            </h1>
        </div>

        <div class="content-area">
            <div class="card mb-6 flex justify-between items-center" style="border: none; box-shadow: var(--shadow-sm);">
                <label class="form-label mb-0 font-bold" style="margin-bottom:0;">Select Date</label>
                <input type="date" id="reportDate" class="form-control" style="width: auto; padding: 0.5rem 1rem; border-radius: var(--radius-sm);">
            </div>

            <div id="reportContent" style="display: none;">
                <h2 class="mb-4 font-bold text-lg">Summary Overview</h2>
                <div class="grid-2 mb-6">
                    <div class="dash-stat-card bg-blue">
                        <div class="val" id="repBills">0</div>
                        <div class="lbl">Total Bills</div>
                    </div>
                    <div class="dash-stat-card bg-orange">
                        <div class="val" id="repSales">₹0</div>
                        <div class="lbl">Today's Consumption</div>
                    </div>
                    <div class="dash-stat-card bg-green">
                        <div class="val" id="repPayments">₹0</div>
                        <div class="lbl">Payments Recv.</div>
                    </div>
                    <div class="dash-stat-card bg-purple">
                        <div class="val" id="repPending">₹0</div>
                        <div class="lbl">Pending Amount</div>
                    </div>
                </div>

                <h2 class="mb-4 font-bold text-lg">Client Breakdown</h2>
                <div id="empConsumption">
                    <!-- Dynamic -->
                </div>
            </div>
            
            <div id="loadingState" class="text-center text-muted py-6">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:48px;height:48px;margin:0 auto 1rem;opacity:0.3"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Loading report data...
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                Home
            </a>
            <a href="billing.html" class="nav-item">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                Bill
            </a>
            <a href="employees.html" class="nav-item">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                Clients
            </a>
            <a href="reports.html" class="nav-item active">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                Reports
            </a>
            <a href="whatsapp.html" class="nav-item">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                WA
            </a>
        </nav>
    </div>

    <script src="js/api.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
