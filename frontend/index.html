<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Office Canteen</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            background: linear-gradient(135deg, rgba(15,82,58,0.9) 0%, rgba(15,82,58,0.7) 100%), url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="%230F523A"/></svg>');
            background-size: cover;
        }
        .login-logo {
            background: rgba(16, 185, 129, 0.15);
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card login-card" style="box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);">
            <div class="login-logo">
                <svg fill="currentColor" viewBox="0 0 24 24"><path d="M4 19h16v2H4v-2zm12-4H8V7H4V5h16v2h-4v8zm-2-8h-4v6h4V7z"/></svg>
            </div>
            <h2 class="text-2xl text-primary mb-1 font-bold">Office Canteen</h2>
            <p class="mb-6 text-muted text-sm">Welcome Back!</p>
            
            <form id="loginForm">
                <div class="form-group text-left">
                    <label class="form-label text-xs font-bold text-muted text-uppercase" style="letter-spacing: 0.05em;">Username</label>
                    <div style="position: relative;">
                        <svg style="position: absolute; left: 12px; top: 12px; width: 20px; height: 20px; color: var(--text-muted);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        <input type="text" id="username" class="form-control" style="padding-left: 2.5rem;" required placeholder="Enter username">
                    </div>
                </div>
                <div class="form-group text-left mb-6">
                    <label class="form-label text-xs font-bold text-muted text-uppercase" style="letter-spacing: 0.05em;">Password</label>
                    <div style="position: relative;">
                        <svg style="position: absolute; left: 12px; top: 12px; width: 20px; height: 20px; color: var(--text-muted);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        <input type="password" id="password" class="form-control" style="padding-left: 2.5rem;" required placeholder="Enter password">
                    </div>
                </div>
                
                <button type="submit" id="loginBtn" class="btn btn-primary font-bold text-lg" style="height: 50px;">Login</button>
                
                <div class="mt-6 pt-4 text-xs text-muted" style="border-top: 1px solid var(--border-color);">
                    Healthy Food &bull; Happy Team<br>
                    <span style="font-size: 0.65rem; opacity: 0.7;">Powered by SHP Technology</span>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
