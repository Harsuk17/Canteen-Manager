<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu - Office Canteen</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <div class="top-bar">
            <div class="flex items-center gap-2">
                <a href="dashboard.html" style="color: var(--text-muted);">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:24px;height:24px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </a>
                <h1>Menu</h1>
            </div>
            <button class="btn btn-primary" style="padding: 0.25rem 0.75rem; width: auto;" onclick="openAddModal()">+ Add</button>
        </div>

        <div class="content-area">
            <div id="menuList">
                <p class="text-center text-muted py-4">Loading...</p>
            </div>
        </div>

    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="menuModal">
        <div class="modal">
            <h2 id="modalTitle">Add Item</h2>
            <form id="menuForm">
                <input type="hidden" id="itemId">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" id="itemName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Price (₹)</label>
                    <input type="number" id="itemPrice" class="form-control" required min="0">
                </div>
                <div class="form-group">
                    <label class="form-label">Unit</label>
                    <input type="text" id="itemUnit" class="form-control" placeholder="e.g. 1 plate">
                </div>
                <div class="form-group">
                    <label class="form-label">Status</label>
                    <select id="itemStatus" class="form-control">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
                <div class="flex gap-2 mt-4">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
